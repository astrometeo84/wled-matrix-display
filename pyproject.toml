# Dieses Projekt liefert keine Python-Bibliothek aus, sondern einen
# Home-Assistant-Blueprint. Die pyproject.toml gibt es nur, damit uv die
# Werkzeuge für Tests und Linting verwalten kann.

[project]
name = "wled-matrix-display"
# Platzhalter, absichtlich eingefroren. Die echte Version des Projekts steht
# allein im Kopf des Blueprints; nur dort hebt release-please sie an.
#
# Früher stand sie auch hier. Das ging nicht gut: uv schreibt die Version des
# eigenen Projekts in die uv.lock. Hebt release-please sie in dieser Datei an,
# ohne dass jemand `uv lock` laufen lässt, passen Sperrdatei und pyproject
# nicht mehr zusammen – und die CI des Release-PR scheitert an --locked.
# Ausgerechnet der PR, den man mergen will, wäre dann blockiert.
#
# Da hier kein Paket gebaut und nichts veröffentlicht wird (package = false),
# ist die Nummer ohnehin bedeutungslos. Bitte nicht "aktualisieren".
version = "0"
description = "Home-Assistant-Blueprint für eine WLED-Matrix als Info-Anzeige"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "yamllint>=1.35",
]

[tool.uv]
# Nichts zu bauen: Es gibt kein Paket, nur Tests und YAML-Dateien.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"
