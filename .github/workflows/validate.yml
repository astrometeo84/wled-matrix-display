name: Validierung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yamllint:
    name: YAML-Stil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Die uv-Version ist bewusst festgenagelt. Ohne Angabe installiert
      # setup-uv nicht die neueste uv, sondern die in der Action-Version
      # hinterlegte. Ist die älter als die lokale, kennt sie das Format der
      # uv.lock nicht (Feld "revision") und will die Datei neu schreiben –
      # woran dann --locked scheitert, obwohl lokal alles stimmt.
      # Beim Anheben der lokalen uv diese Zeile mitziehen.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.12.18"
      # --locked bricht ab, wenn uv.lock nicht zur pyproject.toml passt.
      # So fällt auf, wenn jemand eine Abhängigkeit ändert und vergisst,
      # die Sperrdatei neu zu erzeugen.
      - run: uv run --locked yamllint --strict .

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.12.18"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -v

  home-assistant:
    name: Home Assistant lädt den Blueprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Eine vollständige HA-Konfiguration bauen, die den Blueprint benutzt.
      # Damit prüft Home Assistant selbst, ob Aufbau, Selektoren und
      # Vorlagen gültig sind – der aussagekräftigste Test im Repo.
      - name: Test-Konfiguration erzeugen
        run: |
          mkdir -p ha/blueprints/automation/wled_matrix
          cp blueprints/automation/wled_matrix/*.yaml ha/blueprints/automation/wled_matrix/
          cp tests/fixtures/configuration.yaml ha/configuration.yaml
          cp tests/fixtures/automations.yaml ha/automations.yaml

      - name: Konfiguration prüfen
        uses: frenck/action-home-assistant@v1
        with:
          path: ./ha
          secrets: ./tests/fixtures/secrets.yaml
          version: stable
